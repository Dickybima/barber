<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lokasi &amp; Kontak · Old Soul Barber Club</title>
  <meta name="description" content="Barbershop bergaya Chicano di Bali — fade tajam, slick back klasik, dan cukur pisau tradisional. Booking potong rambut via WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Pirata+One&family=Poppins:wght@300;400;500;600&family=Yesteryear&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="kontak">

  <!-- ========== NAVBAR ========== -->
  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-emblem" data-logo="emblem"></span> <span data-shop-name>Old Soul Barber Club</span></a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">Beranda</a>
        <a href="layanan.html" data-i18n="nav.services">Layanan</a>
        <a href="barber.html" data-i18n="nav.barbers">Barber</a>
        <a href="model.html" data-i18n="nav.styles">Model</a>
        <a href="kontak.html" class="active" aria-current="page" data-i18n="nav.contact">Kontak</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang="id">ID</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Buka menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ========== JUDUL HALAMAN ========== -->
  <section class="page-banner">
    <div class="container page-banner-content">
      <p class="eyebrow" data-i18n="contact.eyebrow">Kunjungi Kami</p>
      <h1 data-i18n="contact.title">Lokasi &amp; Jam Buka</h1>
      <p class="breadcrumb"><a href="index.html" data-i18n="nav.home">Beranda</a> <span>/</span> <span data-i18n="nav.contact">Kontak</span></p>
    </div>
  </section>

  <!-- ========== KONTAK ========== -->
  <section class="section" id="kontak">
    <div class="container contact-wrap">
      <div class="contact-info">
        <p class="eyebrow">Ven a vernos</p>
        <h2 data-i18n="contact.getInTouch">Hubungi Kami</h2>
        <div class="contact-item">
          <span class="contact-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
          <p data-address>Jl. Sudirman No. 123, Jakarta Pusat</p>
        </div>
        <div class="contact-item">
          <span class="contact-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span>
          <p><a data-phone-link href="#"><span data-phone>0812-3456-7890</span></a></p>
        </div>
        <div class="contact-item">
          <span class="contact-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></span>
          <p><a data-instagram-link href="#" target="_blank" rel="noopener"><span data-instagram>@gentlemanscut.id</span></a></p>
        </div>
        <table class="hours" id="hoursTable"></table>
      </div>
      <div class="map">
        <iframe id="mapFrame" title="Lokasi barbershop" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </section>
  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container footer-inner">
      <a href="index.html" class="footer-logo" data-logo="badge" aria-label="Old Soul Barber Club"></a>
      <p>&copy; <span id="year"></span> <span data-shop-name>Old Soul Barber Club</span>. <span data-i18n="footer.rights">Semua hak dilindungi.</span></p>
    </div>
  </footer>

  <!-- Tombol WhatsApp melayang -->
  <a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="Chat WhatsApp">
    <svg viewBox="0 0 32 32" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.2.6 4.4 1.7 6.3L3.2 29l7.3-1.9c1.8 1 3.9 1.5 5.9 1.5 7 0 12.7-5.7 12.7-12.6C29.1 8.6 23 3 16 3zm0 23.1c-1.9 0-3.8-.5-5.4-1.5l-.4-.2-4.3 1.1 1.2-4.2-.3-.4c-1.1-1.7-1.6-3.6-1.6-5.6C5.2 9.8 10 5.1 16 5.1c5.9 0 10.8 4.7 10.8 10.5S21.9 26.1 16 26.1zm5.9-7.8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 .8.4 1.4.6 1.9.7.8.3 1.6.2 2.2.1.7-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
  </a>

  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
